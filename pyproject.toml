[project]
name = "otium"
version = "1.0.0-beta"
description = "A life spent on what you meant it to be."
requires-python = "==3.13.2"
dependencies = []

[tool.uv]
package = true
constraint-dependencies = [
    "urllib3>=2.7.0", # CVE-2026-44431, CVE-2026-44432
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "black[d]>=26.3.1",
    "deptry>=0.23.0",
    "pip>=26.1", # CVE-2026-6357
    "pip-audit>=2.6.1",
    "poethepoet>=0.32.0",
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "ty>=0.0.18",
    "types-pyyaml>=6.0",
]

[tool.poe.tasks]
depcheck = "deptry . --per-rule-ignores DEP004=pytest"
format = "black ."
lint = "ruff check"
typecheck = "ty check"
audit-src = "bandit -r src/* -s B101"
audit-packages = "pip-audit"
security = ["audit-src", "audit-packages"]
checks = ["depcheck", "format", "lint", "typecheck", "security"]
unit = "pytest -vv src/*"
integration = "pytest -vv tests/*"
cover = "pytest -vv --cov"
review = "claude 'run code-reviewer agent against diff for quality and elegance'"
commit = "bash -c 'uv run poe checks && uv run poe cover && uv run poe review && git add -A && git cz && git push'"

[tool.coverage.run]
omit = ["*/test_*.py", "tests/*"]
